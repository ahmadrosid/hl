<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlight</title>
  <style>
    .highlight-table {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      color: #24292f;
      font-size: 12px;
      word-wrap: normal;
      white-space: pre-wrap;
      word-wrap: break-all;
    }

    .hl-num {
      color: #6e7781;
      line-height: 20px;
      text-align: right;
      padding-right: 10px;
      padding-left: 10px;
    }

    .hl-num::before {
      content: attr(data-line);
    }

    .hl-mh { color: #0550ae }
    .hl-s { color: #0a3069 }
    .hl-id { color: #b465e2 }
    .hl-k { color: #cf222e }
    .hl-c { color: #0550ae }
    .hl-cmt { color: #6e7781 }
    .hl-en { color: #8250df }
    .hl-ent { color: #116329 }
    .hl-v { color: #953800 }
    .hl-vid { color: #404040 }
  </style>
</head>

<body>
  {content}
</body>

<script>
  let mtime = null;
  async function poll() {
    try {
      const res = await fetch("/mtime");
      const next = await res.text();
      if (mtime === null) mtime = next;
      else if (next !== mtime) location.reload();
    } catch (_) {}
  }
  setInterval(poll, 500);
  poll();
</script>
</html>
